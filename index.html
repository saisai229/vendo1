<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VenduPro Smart Kiosk</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f6fa;color:#222}
header{background:#111827;color:white;padding:16px;display:flex;justify-content:space-between;align-items:center}
header h2{margin:0}
button{border:0;padding:11px 15px;border-radius:8px;background:#2563eb;color:white;cursor:pointer}
input{width:100%;padding:12px;margin:6px 0 12px;border:1px solid #ccc;border-radius:7px}
.container{max-width:1000px;margin:auto;padding:16px}
.section{background:white;padding:16px;border-radius:12px;margin:15px 0}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.product{background:white;border-radius:12px;padding:12px;box-shadow:0 2px 8px #0001}
.product img{width:100%;height:145px;object-fit:contain}
.price{font-weight:bold;color:#087443}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.hidden{display:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
small{color:#666}
</style>
</head>
<body>

<header>
  <h2 id="brand">VenduPro</h2>
  <button onclick="showAdmin()">Admin</button>
</header>

<div class="container">

<section id="home" class="section">
  <h2 id="welcome">Welcome to Smart Kiosk</h2>
  <p>Select your products and place your order.</p>
  <button onclick="showMenu()">Explore Products</button>
</section>

<section id="menu" class="section hidden">
  <h2>Products</h2>
  <div id="products" class="products"></div>
</section>

<section id="cart" class="section hidden">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <h3 id="total">Total: ₹0</h3>
  <label>Table Number</label>
  <input id="tableNo" placeholder="Enter table number">
  <button onclick="placeOrder('UPI')">Pay with UPI</button>
  <button onclick="placeOrder('Cash')">Pay Cash</button>
</section>

<section id="adminLogin" class="section hidden">
  <h2>Admin Login</h2>
  <input id="adminPin" type="password" placeholder="Admin PIN">
  <button onclick="loginAdmin()">Login</button>
</section>

<section id="admin" class="section hidden">
  <h2>Admin Panel</h2>

  <h3>Brand Settings</h3>
  <input id="brandInput" placeholder="Brand Name">
  <button onclick="saveBrand()">Save Brand</button>

  <h3>Admin PIN</h3>
  <input id="newPin" type="password" placeholder="New PIN">
  <button onclick="changePin()">Change PIN</button>

  <h3>Add / Edit Product</h3>
  <input id="productId" type="hidden">
  <input id="pName" placeholder="Product Name">
  <input id="pPrice" type="number" placeholder="Price">
  <input id="pImage" placeholder="Image URL">
  <input id="pSlot" placeholder="Machine Slot">
  <button onclick="saveProduct()">Save Product</button>

  <h3>Manage Products</h3>
  <div id="adminProducts"></div>

  <h3>Customer Orders</h3>
  <button onclick="loadOrders()">Refresh Orders</button>
  <div id="orders"></div>

  <button onclick="logoutAdmin()">Logout</button>
</section>

</div>

<script>
// 1. SUPABASE CONFIGURATION
const SUPABASE_URL = "YOUR_SUPABASE_PROJECT_URL";
const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 2. SETTINGS
let ADMIN_PIN = localStorage.getItem("vendupro_pin") || "1234";
let cart = [];
let productList = [];

// 3. PAGE NAVIGATION
function hideAll(){
  ["home","menu","cart","adminLogin","admin"].forEach(id=>{
    document.getElementById(id).classList.add("hidden");
  });
}
function showMenu(){
  hideAll();
  document.getElementById("menu").classList.remove("hidden");
  document.getElementById("cart").classList.remove("hidden");
  loadProducts();
}
function showAdmin(){
  hideAll();
  document.getElementById("adminLogin").classList.remove("hidden");
}

// 4. LOAD PRODUCTS FROM SUPABASE
async function loadProducts(){
  const {data,error}=await db.from("products").select("*").order("id");
  if(error){
    alert("Products loading error: "+error.message);
    return;
  }
  productList=data||[];
  renderProducts();
  renderAdminProducts();
}

function renderProducts(){
  const box=document.getElementById("products");
  box.innerHTML="";
  productList.forEach(p=>{
    box.innerHTML+=`
      <div class="product">
        <img src="${escapeAttr(p.image_url||"")}" onerror="this.style.display='none'">
        <h3>${escapeHtml(p.name)}</h3>
        <p class="price">₹${Number(p.price)||0}</p>
        <button onclick="addToCart('${escapeAttr(p.id)}')">Add to Cart</button>
      </div>`;
  });
}

// 5. CART
function addToCart(id){
  const p=productList.find(x=>String(x.id)===String(id));
  if(!p)return;
  const existing=cart.find(x=>String(x.id)===String(id));
  if(existing) existing.qty++;
  else cart.push({...p,qty:1});
  renderCart();
}
function renderCart(){
  const box=document.getElementById("cartItems");
  box.innerHTML="";
  let total=0;
  cart.forEach((p,i)=>{
    total+=Number(p.price)*p.qty;
    box.innerHTML+=`
      <div class="row">
        <span>${escapeHtml(p.name)} × ${p.qty}</span>
        <span>
          ₹${Number(p.price)*p.qty}
          <button onclick="changeQty(${i},-1)">−</button>
          <button onclick="changeQty(${i},1)">+</button>
        </span>
      </div>`;
  });
  document.getElementById("total").innerText="Total: ₹"+total;
}
function changeQty(i,n){
  cart[i].qty+=n;
  if(cart[i].qty<=0)cart.splice(i,1);
  renderCart();
}

// 6. PLACE ORDER
async function placeOrder(method){
  if(!cart.length)return alert("Cart is empty");
  const table=document.getElementById("tableNo").value.trim();
  if(!table)return alert("Enter table number");

  const total=cart.reduce((s,p)=>s+Number(p.price)*p.qty,0);

  const order={
    table_no:table,
    items:cart.map(p=>({
      product_id:p.id,
      name:p.name,
      price:Number(p.price),
      quantity:p.qty
    })),
    total:total,
    payment_method:method,
    status:"Pending"
  };

  const {data,error}=await db.from("orders").insert(order).select();

  if(error){
    alert("Order failed: "+error.message);
    return;
  }

  if(method==="UPI"){
    const upiId="YOUR_UPI_ID";
    const upiUrl=`upi://pay?pa=${encodeURIComponent(upiId)}&pn=VenduPro&am=${total}&cu=INR`;
    window.location.href=upiUrl;
  }else{
    alert("Order placed! Please pay at the counter.");
  }

  cart=[];
  renderCart();
}

// 7. ADMIN LOGIN
function loginAdmin(){
  if(document.getElementById("adminPin").value!==ADMIN_PIN){
    alert("Wrong PIN");
    return;
  }
  hideAll();
  document.getElementById("admin").classList.remove("hidden");
  document.getElementById("brandInput").value=
    localStorage.getItem("vendupro_brand")||"VenduPro";
  loadProducts();
  loadOrders();
}
function logoutAdmin(){
  hideAll();
  document.getElementById("home").classList.remove("hidden");
}
function changePin(){
  const pin=document.getElementById("newPin").value.trim();
  if(pin.length<4)return alert("PIN must be at least 4 characters");
  ADMIN_PIN=pin;
  localStorage.setItem("vendupro_pin",pin);
  alert("PIN changed");
}

// 8. BRAND NAME
function saveBrand(){
  const name=document.getElementById("brandInput").value.trim();
  if(!name)return;
  localStorage.setItem("vendupro_brand",name);
  document.getElementById("brand").innerText=name;
  document.getElementById("welcome").innerText="Welcome to "+name;
  alert("Brand name saved");
}

// 9. ADD / EDIT PRODUCT
async function saveProduct(){
  const id=document.getElementById("productId").value;
  const name=document.getElementById("pName").value.trim();
  const price=Number(document.getElementById("pPrice").value);
  const image_url=document.getElementById("pImage").value.trim();
  const slot=document.getElementById("pSlot").value.trim();

  if(!name||!Number.isFinite(price)||price<0){
    alert("Enter valid product name and price");
    return;
  }

  const item={name,price,image_url,slot};

  let result;
  if(id){
    result=await db.from("products").update(item).eq("id",id);
  }else{
    result=await db.from("products").insert(item);
  }

  if(result.error){
    alert("Save error: "+result.error.message);
    return;
  }

  document.getElementById("productId").value="";
  document.getElementById("pName").value="";
  document.getElementById("pPrice").value="";
  document.getElementById("pImage").value="";
  document.getElementById("pSlot").value="";
  await loadProducts();
  alert("Product saved");
}

function renderAdminProducts(){
  const box=document.getElementById("adminProducts");
  box.innerHTML="";
  productList.forEach(p=>{
    box.innerHTML+=`
      <div class="section">
        <b>${escapeHtml(p.name)}</b> — ₹${Number(p.price)||0}
        <div class="actions">
          <button onclick="editProduct('${escapeAttr(p.id)}')">Edit</button>
          <button onclick="deleteProduct('${escapeAttr(p.id)}')">Delete</button>
        </div>
      </div>`;
  });
}
function editProduct(id){
  const p=productList.find(x=>String(x.id)===String(id));
  if(!p)return;
  document.getElementById("productId").value=p.id;
  document.getElementById("pName").value=p.name||"";
  document.getElementById("pPrice").value=p.price||0;
  document.getElementById("pImage").value=p.image_url||"";
  document.getElementById("pSlot").value=p.slot||"";
}
async function deleteProduct(id){
  if(!confirm("Delete this product?"))return;
  const {error}=await db.from("products").delete().eq("id",id);
  if(error)return alert(error.message);
  loadProducts();
}

// 10. LOAD ORDERS
async function loadOrders(){
  const box=document.getElementById("orders");
  box.innerHTML="Loading...";
  const {data,error}=await db.from("orders").select("*").order("created_at",{ascending:false});
  if(error){
    box.innerText="Orders error: "+error.message;
    return;
  }
  box.innerHTML="";
  (data||[]).forEach(o=>{
    box.innerHTML+=`
      <div class="section">
        <b>Order #${escapeHtml(o.id)}</b>
        <p>Table: ${escapeHtml(o.table_no)}</p>
        <p>Total: ₹${Number(o.total)||0}</p>
        <p>Payment: ${escapeHtml(o.payment_method)}</p>
        <p>Status: ${escapeHtml(o.status)}</p>
        <button onclick="updateOrder('${escapeAttr(o.id)}')">Mark Completed</button>
      </div>`;
  });
}
async function updateOrder(id){
  const {error}=await db.from("orders").update({status:"Completed"}).eq("id",id);
  if(error)return alert(error.message);
  loadOrders();
}

// 11. BASIC TEXT SAFETY
function escapeHtml(value){
  return String(value??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function escapeAttr(value){return escapeHtml(value);}

// 12. STARTUP
const savedBrand=localStorage.getItem("vendupro_brand")||"VenduPro";
document.getElementById("brand").innerText=savedBrand;
document.getElementById("welcome").innerText="Welcome to "+savedBrand;
loadProducts();
</script>
</body>
</html>
